; An M8 (format 1) settings.cfg: every key M8 wrote, no [meta] section, all
; values off their defaults. test_settings::test_v1_file_loads reads it.

[accessibility]

screen_shake_scale=0.5
hitstop_scale=0.5
flash_reduction=true
vibration_strength=0.7
currency_loss=false
subtitle_size=2
subtitle_background=0
speaker_labels=false
subtitle_speed=1
cinematic_skip_hold=false
memories_at_anchors=false

[audio]

master_volume=0.9
sfx_volume=0.5
music_volume=0.3

[debug]

show_debug_overlay=true

[gameplay]

reactor_mode=1

[playtest]

recording=false
variant="baseline"
